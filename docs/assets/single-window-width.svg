<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">A lone tiled window centred at half width on a standard monitor</title>
  <desc id="description">Illustrative 16:9 monitor showing one window centred at 50 percent of the usable display width, with equal desktop space on both sides.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202642"/>
      <stop offset="0.52" stop-color="#333353"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f88cd" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#65aec8" stop-opacity="0"/>
    </linearGradient>
    <filter id="monitor-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#213047" flood-opacity="0.2"/>
    </filter>
    <filter id="window-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#090e1d" flood-opacity="0.38"/>
    </filter>
    <clipPath id="screen-clip"><rect x="96" y="104" width="1408" height="792" rx="7"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#f4f6fa"/>
  <text x="80" y="55" fill="#26364e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">ONE TILED WINDOW</text>
  <text x="1520" y="55" text-anchor="end" fill="#65748a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Illustrative standard 16:9 display</text>

  <rect x="80" y="88" width="1440" height="824" rx="22" fill="#171d2b" filter="url(#monitor-shadow)"/>
  <rect x="96" y="104" width="1408" height="792" rx="7" fill="url(#desktop)"/>
  <g clip-path="url(#screen-clip)">
    <path d="M96 620 C420 490 650 570 830 410 C1030 230 1250 290 1504 160 L1504 896 L96 896Z" fill="url(#wallpaper)"/>
    <circle cx="1300" cy="730" r="330" fill="#577d9c" opacity="0.13"/>
    <circle cx="220" cy="730" r="270" fill="#b18ace" opacity="0.1"/>
    <rect x="96" y="104" width="1408" height="30" fill="#10182a" opacity="0.7"/>
    <text x="116" y="124" fill="#f2f4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">AeroSpace</text>
    <text x="1483" y="124" text-anchor="end" fill="#f2f4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">◖  ◇  9:41</text>

    <!-- The 704-unit window is exactly half the 1408-unit screen width. -->
    <rect x="448" y="150" width="704" height="724" rx="13" fill="#ffffff" filter="url(#window-shadow)"/>
    <path d="M461 150 H1139 Q1152 150 1152 163 V194 H448 V163 Q448 150 461 150Z" fill="#f4f6fa"/>
    <line x1="448" y1="194" x2="1152" y2="194" stroke="#dce3ec"/>
    <circle cx="471" cy="172" r="6" fill="#ef6a68"/>
    <circle cx="491" cy="172" r="6" fill="#f3c458"/>
    <circle cx="511" cy="172" r="6" fill="#67c778"/>
    <text x="800" y="177" text-anchor="middle" fill="#657187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Writing workspace</text>

    <rect x="448" y="195" width="150" height="679" fill="#f8fafc"/>
    <line x1="598" y1="195" x2="598" y2="874" stroke="#e5eaf0"/>
    <rect x="469" y="225" width="18" height="18" rx="5" fill="#677dbc"/>
    <text x="496" y="239" fill="#34425a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650">Workspace</text>
    <rect x="465" y="282" width="118" height="34" rx="7" fill="#e8edf7"/>
    <circle cx="481" cy="299" r="5" fill="#7587b4"/>
    <rect x="494" y="296" width="66" height="6" rx="3" fill="#9baac0"/>
    <circle cx="481" cy="342" r="5" fill="#c9d3e0"/>
    <rect x="494" y="339" width="53" height="6" rx="3" fill="#c9d3e0"/>
    <circle cx="481" cy="381" r="5" fill="#c9d3e0"/>
    <rect x="494" y="378" width="72" height="6" rx="3" fill="#c9d3e0"/>

    <text x="638" y="261" fill="#8592a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="1">FOCUS SPACE</text>
    <text x="638" y="314" fill="#24334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700">One window, centred.</text>
    <rect x="638" y="340" width="420" height="9" rx="4.5" fill="#b9c5d4"/>
    <rect x="638" y="360" width="352" height="9" rx="4.5" fill="#d0d8e2"/>
    <rect x="638" y="380" width="386" height="9" rx="4.5" fill="#d0d8e2"/>
    <rect x="638" y="434" width="470" height="178" rx="12" fill="#edf2f8"/>
    <rect x="662" y="459" width="185" height="10" rx="5" fill="#a5b7d0"/>
    <rect x="662" y="487" width="398" height="7" rx="3.5" fill="#c4d0df"/>
    <rect x="662" y="504" width="353" height="7" rx="3.5" fill="#c4d0df"/>
    <rect x="662" y="521" width="376" height="7" rx="3.5" fill="#c4d0df"/>
    <rect x="662" y="564" width="108" height="24" rx="7" fill="#6e84be"/>
    <rect x="638" y="655" width="428" height="8" rx="4" fill="#d3dce7"/>
    <rect x="638" y="674" width="390" height="8" rx="4" fill="#d3dce7"/>
    <rect x="638" y="693" width="438" height="8" rx="4" fill="#d3dce7"/>
    <rect x="638" y="712" width="320" height="8" rx="4" fill="#d3dce7"/>
  </g>

  <line x1="448" y1="948" x2="1152" y2="948" stroke="#526ca9" stroke-width="2"/>
  <line x1="448" y1="936" x2="448" y2="960" stroke="#526ca9" stroke-width="2"/>
  <line x1="1152" y1="936" x2="1152" y2="960" stroke="#526ca9" stroke-width="2"/>
  <rect x="662" y="927" width="276" height="39" rx="19.5" fill="#f4f6fa"/>
  <text x="800" y="953" text-anchor="middle" fill="#344c83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">50% of usable width</text>
</svg>
